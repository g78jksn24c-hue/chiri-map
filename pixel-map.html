<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf4f1"><meta name="description" content="炽日像素动态地图，查找街道与地名，点击地点并规划城内路线。"><title>炽日 · 像素动态地图</title><link rel="stylesheet" href="pixel.css"></head>
<body><header class="pixel-topbar"><a class="pixel-brand" href="index.html">◈ <strong>炽日</strong><span>CHIRI CITY</span></a><nav aria-label="城市视图"><a href="pixel-city.html">2D 城市</a><a class="selected" href="pixel-map.html">动态地图</a><a href="atlas.html">高铁沙盘</a></nav><a class="back-home" href="index.html">返回首页 ↗</a></header>
<main class="pixel-shell map-shell"><div class="pixel-heading"><div><span class="pixel-kicker">CITY NAVIGATION / 02</span><h1>每条街，都有自己的方向。</h1><p>查找街道与地名，选择目的地，并在像素城区里规划路线。</p></div><div class="live-status"><span class="live-dot"></span><span>街区交通模拟</span><strong id="map-clock">08:00</strong></div></div>
<div class="map-layout"><aside class="map-sidebar"><label class="map-search-label" for="place-search">搜索城市</label><input id="place-search" type="search" autocomplete="off" placeholder="地名、街道、设施…"><div id="search-suggestions" class="search-suggestions" hidden></div><div class="map-filter" aria-label="地图筛选"><button class="active" data-filter="all" aria-pressed="true">全部</button><button data-filter="area" aria-pressed="false">街区</button><button data-filter="place" aria-pressed="false">地点</button><button data-filter="street" aria-pressed="false">街道</button></div><div class="route-box"><div class="info-kicker">路线规划</div><label for="route-start">出发地</label><select id="route-start"></select><label for="route-end">目的地</label><select id="route-end"></select><button id="plan-route" class="solid-button" type="button">开始导航 ↗</button><div id="route-summary" aria-live="polite">选好起点和终点，就能看到街道路线。</div></div><div class="map-location-list"><h3>城市地点 <span id="result-count"></span></h3><div id="location-list"></div></div></aside>
<section class="pixel-map-stage" aria-label="炽日详细街道地图"><div class="map-stage-bar"><strong>CHIRI / STREET MAP</strong><div><button id="map-zoom-out" aria-label="缩小地图">−</button><button id="map-zoom-in" aria-label="放大地图">＋</button><button id="map-reset" aria-label="复位地图">全图</button></div></div><div class="map-svg-wrap"><svg id="pixel-map" viewBox="0 0 960 640" role="img" aria-label="包含九个街区、街道名称、城市地点和动态交通的炽日像素地图"><defs><pattern id="pixel-grid" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#e8f0e8"/><path d="M16 0H0V16" fill="none" stroke="#d5e5db" stroke-width="1"/></pattern></defs><g id="map-camera"></g></svg><div class="map-compass">N ↑</div><div class="map-legend"><span><i class="legend-road"></i>街道</span><span><i class="legend-rail"></i>环线接驳</span><span><i class="legend-place"></i>可点击地点</span></div></div><div class="map-stage-note">点击地图上的名称查看详情 · 滚轮缩放 · 拖动平移</div></section><aside class="place-panel" id="place-panel" aria-live="polite"><span class="info-kicker">地点详情</span><h2>选择一个地点</h2><p>点击地图标记或左侧列表，查看街区、附近设施和出行路线。</p></aside></div><p class="concept-note">地名、街道及路线均为炽日世界观设定；动态标记为模拟运行。</p></main>
<script src="pixel-world.js"></script><script src="pixel-map.js"></script></body></html>
